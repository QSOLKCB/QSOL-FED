[package]
name = "qsol-fed"
version = "0.6.0"
edition = "2024"
description = "Reference constitutional federation core with durable state and sandboxed NEXUS-derived synthetic worlds"
license = "Apache-2.0"
repository = "https://github.com/QSOLKCB/QSOL-FED"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
unicode-normalization = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
