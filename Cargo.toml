[package]
name = "qsol-fed"
version = "0.2.0"
edition = "2024"
description = "Reference constitutional and canonical wire core for the QSOL-FED sovereign federation protocol"
license = "Apache-2.0"
repository = "https://github.com/QSOLKCB/QSOL-FED"
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
