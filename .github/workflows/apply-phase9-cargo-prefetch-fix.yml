name: apply-phase9-cargo-prefetch-fix

on:
  push:
    branches: [agent/phase9-moriarty-graduation]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-moriarty-graduation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply authenticated Cargo prefetch hardening
        run: |
          set -euo pipefail
          python3 tools/apply_phase9_cargo_prefetch_fix.py
          git diff --check
          rm -rf tools/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/moriarty_isolation.py tools/run_moriarty.py tools/validate_phase9_gate.py
          git commit -m "Bind MORIARTY to authenticated Cargo prefetch"
          git push origin HEAD:agent/phase9-moriarty-graduation
