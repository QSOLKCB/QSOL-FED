name: PR21 coherent writable scan fix

on:
  push:
    branches:
      - ci/moriarty-writable-scan-race
    paths:
      - .github/workflows/pr21-coherent-writable-scan-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/moriarty-writable-scan-race
          fetch-depth: 0
      - name: Apply and commit coherent writable-scan hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/pr21_coherent_scan_fix.py
          python3 -m py_compile tools/moriarty_isolation.py tools/validate_phase9_gate.py
          python3 - <<'PY'
          import json
          for path in ("state/phase9.json", "claims/phase9.json"):
              with open(path, encoding="utf-8") as handle:
                  json.load(handle)
          PY
          git diff --check
          grep -q 'probe_writable_scan_cgroup_suspended' state/phase9.json
          grep -q 'probe_writable_scan_cgroup_suspended' claims/phase9.json
          grep -q 'delegated probe cgroup is suspended' MORIARTY.md
          git rm tools/pr21_coherent_scan_fix.py
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tools/moriarty_isolation.py tools/validate_phase9_gate.py claims/phase9.json state/phase9.json MORIARTY.md
          git commit -m "fix: suspend probe cgroup during writable scans"
          git push origin HEAD:ci/moriarty-writable-scan-race
