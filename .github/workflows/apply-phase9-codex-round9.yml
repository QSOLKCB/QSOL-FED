name: apply-phase9-codex-round9

on:
  push:
    branches: [agent/phase9-moriarty-graduation]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-moriarty-graduation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply Codex round 9 hardening
        run: |
          python3 tools/apply_phase9_codex_round9.py
          python3 -m py_compile tools/run_moriarty.py tools/moriarty_isolation.py tools/validate_phase9_gate.py
          git diff --check
          rm -rf tools/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/run_moriarty.py tools/moriarty_isolation.py tools/validate_phase9_gate.py
          git commit -m "Bound Phase 9 resources and pin replay toolchains"
          git push origin HEAD:agent/phase9-moriarty-graduation
