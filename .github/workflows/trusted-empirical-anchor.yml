name: trusted-empirical-anchor

# SECURITY CONTRACT:
# After bootstrap, this workflow must be selected directly by an organization
# ruleset using "Require workflows to pass before merging". Do not substitute a
# required commit-status context: a PR-head workflow can publish statuses through
# the GitHub Actions app and would therefore be able to impersonate that signal.
#
# This workflow is intentionally read-only and executes no PR-head code. It
# authenticates only Git tree metadata from the reviewed head and protects its
# own workflow path against in-band replacement.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify-empirical-assurance-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Verify PR-head empirical assurance tree from trusted base workflow
        run: |
          set -euo pipefail
          case "$TARGET_SHA" in
            ''|*[!0-9a-f]* ) echo "invalid PR head SHA" >&2; exit 1 ;;
          esac
          test "${#TARGET_SHA}" -eq 40
          case "$BASE_SHA" in
            ''|*[!0-9a-f]* ) echo "invalid PR base SHA" >&2; exit 1 ;;
          esac
          test "${#BASE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || {
            echo "trusted checkout does not match event base SHA" >&2
            exit 1
          }
          case "$PR_NUMBER" in
            ''|*[!0-9]* ) echo "invalid PR number" >&2; exit 1 ;;
          esac

          before_bytes="$(du -sb .git/objects | cut -f1)"
          target_ref="refs/remotes/qsol-pr/${PR_NUMBER}/head"
          timeout --kill-after=10s 60s \
            git -c protocol.version=2 fetch \
              --no-tags --depth=1 --filter=blob:none --force origin \
              "+refs/pull/${PR_NUMBER}/head:${target_ref}"
          observed_head="$(git rev-parse "${target_ref}^{commit}")"
          test "$observed_head" = "$TARGET_SHA" || {
            echo "fetched PR head mismatch: expected ${TARGET_SHA}, observed ${observed_head}" >&2
            exit 1
          }
          after_bytes="$(du -sb .git/objects | cut -f1)"
          added_bytes=$((after_bytes - before_bytes))
          test "$added_bytes" -le 67108864 || {
            echo "untrusted PR-head Git object fetch exceeded 64 MiB bound: ${added_bytes}" >&2
            exit 1
          }

          check_blob() {
            path="$1"
            expected="$2"
            entry="$(git ls-tree "$TARGET_SHA" -- "$path")"
            test -n "$entry" || {
              echo "trusted empirical assurance path missing: ${path}" >&2
              exit 1
            }
            meta="${entry%%$'\t'*}"
            observed_path="${entry#*$'\t'}"
            read -r mode type oid <<< "$meta"
            test "$observed_path" = "$path" || {
              echo "trusted empirical assurance tree path mismatch: ${path}" >&2
              exit 1
            }
            test "$mode" = "100644" || {
              echo "trusted empirical assurance path is not a regular non-executable file: ${path} (${mode})" >&2
              exit 1
            }
            test "$type" = "blob" || {
              echo "trusted empirical assurance path is not a blob: ${path} (${type})" >&2
              exit 1
            }
            test "$oid" = "$expected" || {
              echo "trusted empirical assurance blob drift: ${path}" >&2
              echo "expected ${expected}, observed ${oid}" >&2
              exit 1
            }
          }

          trusted_anchor_path=.github/workflows/trusted-empirical-anchor.yml
          trusted_anchor_entry="$(git ls-tree "$BASE_SHA" -- "$trusted_anchor_path")"
          test -n "$trusted_anchor_entry" || {
            echo "trusted base anchor workflow missing: ${trusted_anchor_path}" >&2
            exit 1
          }
          trusted_anchor_meta="${trusted_anchor_entry%%$'\t'*}"
          trusted_anchor_observed_path="${trusted_anchor_entry#*$'\t'}"
          read -r trusted_anchor_mode trusted_anchor_type trusted_anchor_oid <<< "$trusted_anchor_meta"
          test "$trusted_anchor_observed_path" = "$trusted_anchor_path"
          test "$trusted_anchor_mode" = "100644" || {
            echo "trusted base anchor workflow has unexpected mode: ${trusted_anchor_mode}" >&2
            exit 1
          }
          test "$trusted_anchor_type" = "blob" || {
            echo "trusted base anchor workflow is not a blob: ${trusted_anchor_type}" >&2
            exit 1
          }

          # The executing ruleset-selected base workflow is its own root of trust.
          # A reviewed PR may not delete, replace, chmod, or gitlink this path.
          check_blob "$trusted_anchor_path" "$trusted_anchor_oid"

          check_blob tools/validate_empirical_assurance.py 77ead89c0579fb5316cd3ea6e14724486beaadb0
          check_blob tools/validate_empirical_assurance_core.py 2add32386ef5e435bb9e4bde0684ea6b2eefcb3e
          check_blob tools/validate_empirical_assurance_supplements.py c62dc4e6731b996447443cb93b219dead34606da
          check_blob machine/empirical-assurance.json e3d55db78c358dab5a28dc9018b7fd7aa37117b6
          check_blob schemas/empirical-assurance-v1.schema.json 4dc82d0f704c62fce7d7aa4aaaa7f84e7871882b
          check_blob EMPIRICAL_ASSURANCE.md 7bf43bf806ae0f91945b5dc13dddcd6f63b19056
          check_blob README4AI.md 64806ea18e1cf3f303726f9928f0b54312bb1af2
          check_blob AGENTS.md 185a1cebfdee85f9575f5d8647277e70fd3e21c0
          check_blob .github/workflows/empirical-assurance.yml 18f90533f3354165f938dabca7ce78b3561af295

          echo "Trusted empirical assurance anchor: OK"
