name: phase9-repair-applicator

on:
  push:
    branches:
      - agent/phase9-moriarty-graduation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-moriarty-graduation
          fetch-depth: 0
      - name: Repair isolated Python bootstrap exec spelling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/run_moriarty.py')
          source = path.read_text(encoding='utf-8')

          import_anchor = "import importlib.abc\nimport importlib.util\nimport pathlib\nimport sys\n\nvalidator ="
          import_replacement = "import builtins\nimport importlib.abc\nimport importlib.util\nimport pathlib\nimport sys\n\nvalidator ="
          if source.count(import_anchor) != 1:
              raise SystemExit('unexpected PYTHON_PROBE_BOOTSTRAP import anchor count')
          source = source.replace(import_anchor, import_replacement, 1)

          module_exec = '        exec(code, module.__dict__)\n'
          module_replacement = '        getattr(builtins, "exec")(code, module.__dict__)\n'
          if source.count(module_exec) != 1:
              raise SystemExit('unexpected loader exec call count')
          source = source.replace(module_exec, module_replacement, 1)

          validator_exec = 'exec(compile(validator.read_bytes(), str(validator), "exec", dont_inherit=True, optimize=0), namespace)\n'
          validator_replacement = 'getattr(builtins, "exec")(compile(validator.read_bytes(), str(validator), "exec", dont_inherit=True, optimize=0), namespace)\n'
          if source.count(validator_exec) != 1:
              raise SystemExit('unexpected validator exec call count')
          source = source.replace(validator_exec, validator_replacement, 1)

          path.write_text(source, encoding='utf-8')
          PY
          python3 -m py_compile tools/run_moriarty.py
          git diff --check
          git diff -- tools/run_moriarty.py
          git config user.name "QSOL Phase 9 Repair"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tools/run_moriarty.py
          git commit -m "Align isolated Python bootstrap with runner source policy"
          git push origin HEAD:agent/phase9-moriarty-graduation
