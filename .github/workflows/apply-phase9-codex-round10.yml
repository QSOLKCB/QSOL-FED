name: apply-phase9-codex-round10

on:
  push:
    branches: [agent/phase9-moriarty-graduation]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-moriarty-graduation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply source hardening
        run: |
          set -euo pipefail
          python3 tools/apply_phase9_codex_round10.py
          git diff --check
          rm -rf tools/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/moriarty_isolation.py tools/run_moriarty.py tools/validate_phase9_gate.py
          git commit -m "Address latest Phase 9 Codex isolation findings"
          git push origin HEAD:agent/phase9-moriarty-graduation
