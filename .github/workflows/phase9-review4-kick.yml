name: phase9-review4-kick

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-moriarty-graduation
          fetch-depth: 0
      - name: Apply queued repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/phase9-review4-repair.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          prefix = '          '
          lines = []
          for line in source[start:end]:
              if line and not line.startswith(prefix):
                  raise SystemExit(f'unexpected repair indentation: {line!r}')
              lines.append(line[len(prefix):] if line else '')
          Path('/tmp/phase9-review4-repair.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 /tmp/phase9-review4-repair.py
          python3 -m py_compile tools/run_moriarty.py tools/moriarty_isolation.py tools/validate_phase9_gate.py
          python3 -m json.tool schemas/moriarty-report-v1.schema.json >/dev/null
          git diff --check
          git config user.name "QSOL Phase 9 Repair"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tools/run_moriarty.py tools/moriarty_isolation.py tools/validate_phase9_gate.py schemas/moriarty-report-v1.schema.json
          git commit -m "Harden MORIARTY against review round four"
          git push origin HEAD:agent/phase9-moriarty-graduation
