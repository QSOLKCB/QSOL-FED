name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  constitutional-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          python3 --version
      - name: Rust tests
        run: cargo test --all-targets
      - name: Constitution drift check
        run: python3 tools/validate_constitution.py
