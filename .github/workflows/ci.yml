name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  apply-phase9-ci-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-moriarty-graduation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply and clean Phase 9 CI fix
        run: |
          python3 tools/apply_phase9_codex_round2.py
          python3 -m py_compile tools/moriarty_isolation.py
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f .github/workflows/apply-phase9-ci-fix.yml tools/apply_phase9_codex_round2.py
          rm -rf tools/__pycache__
          git diff --check
      - name: Commit clean source fix
        run: |
          git config user.name "Trent Slade"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add .github/workflows/ci.yml tools/moriarty_isolation.py
          git diff --cached --check
          git commit -m "Fix target-specific Cargo archive authentication"
          git push origin HEAD:agent/phase9-moriarty-graduation

  constitutional-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.number != 13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned QSOL-NEXUS adapter source
        uses: actions/checkout@v4
        with:
          repository: QSOLKCB/QSOL-NEXUS
          ref: 24cb0ce246d12ac99e7d190a8890ef2ddd598321
          path: .deps/QSOL-NEXUS
          persist-credentials: false
      - name: Checkout pinned QSOL-ORACLE live transport
        uses: actions/checkout@v4
        with:
          repository: QSOLKCB/QSOL-ORACLE
          ref: 043e864b3c25dfeca3ce1752b3110479479071b1
          path: .deps/QSOL-ORACLE
          persist-credentials: false
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          python3 --version
          node --version
      - name: Rust tests, state, Holodeck, adapters, SDKs, Assembly, transports, and fuzz smoke
        run: cargo test --all-targets --locked
      - name: Phase 6 three-implementation SDK conformance
        run: |
          cargo run --locked --quiet --bin qsol-fed-sdk-conformance > /tmp/phase6-rust.json
          python3 sdk/python/conformance.py > /tmp/phase6-python.json
          node sdk/typescript/conformance.mjs > /tmp/phase6-js.json
          cmp /tmp/phase6-rust.json /tmp/phase6-python.json
          cmp /tmp/phase6-rust.json /tmp/phase6-js.json
      - name: Phase 6 hostile SDK parser and wire regressions
        run: |
          python3 sdk/python/test_sdk.py
          node sdk/typescript/adversarial.mjs
      - name: Phase 6 neutral third-party node participation
        run: |
          python3 examples/neutral_research_node.py > /tmp/phase6-third-party.json
          python3 - <<'PY'
          import json
          node=json.load(open('/tmp/phase6-third-party.json', encoding='utf-8'))
          expected=json.load(open('fixtures/phase6/conformance.json', encoding='utf-8'))['expected']
          assert node['schema'] == 'third-party-federation-participation/1'
          assert node['governance_model'] == 'local'
          assert node['qsol_governance_adopted'] is False
          assert node['nexus_required'] is False
          assert node['council_required'] is False
          assert node['oracle_required'] is False
          assert node['ark_required'] is False
          assert node['holodeck_required'] is False
          assert node['authority_effect'] == 'none'
          assert node['node_manifest_object_id'] == expected['node_manifest_object_id']
          assert node['payload_object_id'] == expected['payload_object_id']
          assert node['provenance_object_id'] == expected['provenance_object_id']
          assert node['hello_message_id'] == expected['hello_message_id']
          assert node['evidence_message_id'] == expected['evidence_message_id']
          PY
      - name: Native NEXUS Phase 5 fixture conformance
        run: |
          python3 tools/generate_nexus_phase5_fixture.py \
            --nexus-src .deps/QSOL-NEXUS/src \
            --output /tmp/nexus-world-export.json
          cmp fixtures/phase5/nexus-world-export.json /tmp/nexus-world-export.json
          python3 tools/nexus_live_adapter.py \
            --nexus-src .deps/QSOL-NEXUS/src \
            --bundle fixtures/phase5/nexus-world-export.json \
            --output /tmp/nexus-source-manifest.json \
            source-manifest
          cmp fixtures/phase5/nexus-source-manifest.json /tmp/nexus-source-manifest.json
          python3 tools/nexus_live_adapter.py \
            --nexus-src .deps/QSOL-NEXUS/src \
            --bundle fixtures/phase5/nexus-world-export.json \
            --output /tmp/nexus-council-reports.json \
            council-reports
          cmp fixtures/phase5/nexus-council-reports.json /tmp/nexus-council-reports.json
      - name: Native NEXUS adapter adversarial source and secret checks
        run: |
          cp -a .deps/QSOL-NEXUS /tmp/QSOL-NEXUS-tampered
          printf '\n# intentional Phase 5 source-identity tamper\n' >> /tmp/QSOL-NEXUS-tampered/src/nexus_runtime/persistent_world.py
          if python3 tools/nexus_live_adapter.py \
            --nexus-src /tmp/QSOL-NEXUS-tampered/src \
            --bundle fixtures/phase5/nexus-world-export.json \
            --output /tmp/tampered-projection.json \
            projection; then
            echo "tampered NEXUS checkout was accepted"
            exit 1
          fi
          python3 tools/generate_nexus_phase5_fixture.py \
            --nexus-src .deps/QSOL-NEXUS/src \
            --minority-rationale "sk-aaaaaaaaaaaaaaaaaaaaaaaa" \
            --output /tmp/nexus-secret-world-export.json
          if python3 tools/nexus_live_adapter.py \
            --nexus-src .deps/QSOL-NEXUS/src \
            --bundle /tmp/nexus-secret-world-export.json \
            --output /tmp/secret-projection.json \
            council-reports; then
            echo "secret-bearing NEXUS Council text crossed into FED projection"
            exit 1
          fi
      - name: Phase 5C ORACLE donor contract and schema conformance
        run: |
          cmp contracts/oracle-fed-membrane-v1.json .deps/QSOL-ORACLE/contracts/fed-membrane.json
          cmp schemas/oracle-transport-request-v1.schema.json .deps/QSOL-ORACLE/schema/fed-transport-request.schema.json
          cmp schemas/oracle-transport-response-v1.schema.json .deps/QSOL-ORACLE/schema/fed-transport-response.schema.json
          cmp schemas/oracle-observation-v1.schema.json .deps/QSOL-ORACLE/schema/fed-oracle-observation.schema.json
          test "$(sha256sum .deps/QSOL-ORACLE/tools/nexus_membrane_common.py | cut -d' ' -f1)" = "4e4c749b67688678f03692d9533adb64760a3b448b3b804acb9f7f95e986c381"
      - name: Phase 5C live ORACLE process conformance
        run: |
          cargo run --locked --quiet --bin qsol-fed-oracle -- .deps/QSOL-ORACLE > /tmp/oracle-live-probe.json
          python3 - <<'PY'
          import json
          probe=json.load(open('/tmp/oracle-live-probe.json', encoding='utf-8'))
          assert probe['status'] == 'verified'
          assert probe['oracle_commit'] == '043e864b3c25dfeca3ce1752b3110479479071b1'
          assert probe['oracle_release_fingerprint'] == '7b0eff4dfa9b0caa84f14920d21f6a5446114535d82706cb62e34773c39818d2'
          assert probe['state'] == 'known'
          assert probe['evidence_refs'] == 1
          assert probe['authority_effect'] == 'none'
          assert probe['ledger_mutated'] is False
          assert probe['transport_authority'] == 'none'
          PY
      - name: Phase 5C ORACLE attestation rejects donor tampering
        run: |
          cp -a .deps/QSOL-ORACLE /tmp/QSOL-ORACLE-tampered
          printf '\n# intentional Phase 5C transport tamper\n' >> /tmp/QSOL-ORACLE-tampered/tools/fed_transport.py
          if cargo run --locked --quiet --bin qsol-fed-oracle -- /tmp/QSOL-ORACLE-tampered; then
            echo "tampered ORACLE donor release was accepted"
            exit 1
          fi
      - name: Phase 5C rejects forged fingerprint self-claim
        run: |
          cp -a .deps/QSOL-ORACLE /tmp/QSOL-ORACLE-forged-fingerprint
          printf '\n<!-- intentional non-critical fingerprinted-file tamper -->\n' >> /tmp/QSOL-ORACLE-forged-fingerprint/docs/FED.md
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/QSOL-ORACLE-forged-fingerprint')
          path = root / 'release/fingerprint.json'
          fp = json.loads(path.read_text(encoding='utf-8'))
          raw = (root / 'docs/FED.md').read_bytes()
          for record in fp['files']:
              if record['path'] == 'docs/FED.md':
                  record['bytes'] = len(raw)
                  record['sha256'] = hashlib.sha256(raw).hexdigest()
                  break
          else:
              raise SystemExit('docs/FED.md missing from release fingerprint')
          canonical = lambda value: json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          fp['files_sha256'] = hashlib.sha256(canonical(fp['files'])).hexdigest()
          path.write_text(json.dumps(fp, indent=2) + '\n', encoding='utf-8')
          PY
          if cargo run --locked --quiet --bin qsol-fed-oracle -- /tmp/QSOL-ORACLE-forged-fingerprint; then
            echo "forged ORACLE release fingerprint self-claim was accepted"
            exit 1
          fi
      - name: Constitution drift check
        run: python3 tools/validate_constitution.py
      - name: Historical Phase 0 claim gate
        run: python3 tools/validate_phase0_gate.py
      - name: Phase 1 independent Python wire gate
        run: python3 tools/validate_phase1_gate.py
      - name: Historical Phase 2 cryptographic identity gate
        run: python3 tools/validate_phase2_gate.py
      - name: Historical Phase 3 reference API gate
        run: python3 tools/validate_phase3_gate.py
      - name: Historical Phase 4 federation state gate
        run: python3 tools/validate_phase4_gate.py
      - name: Historical Phase 5A sandboxed AI Holodeck gate
        run: python3 tools/validate_phase5a_gate.py
      - name: Historical Phase 5 QSOL adapter gate
        run: python3 tools/validate_phase5_gate.py
      - name: Historical Phase 5C live QSOL-ORACLE gate
        run: python3 tools/validate_phase5c_gate.py
      - name: Historical Phase 6 third-party SDK gate
        run: python3 tools/validate_phase6_gate.py
      - name: Historical Phase 7 Federation Assembly gate
        run: python3 tools/validate_phase7_gate.py
      - name: Phase 8 additional transports and resilience gate
        run: python3 tools/validate_phase8_gate.py
      - name: Phase 9 MORIARTY/1 exact-commit graduation gate
        env:
          MORIARTY_TARGET_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          MORIARTY_REPORT_DIR: ${{ runner.temp }}/moriarty-report
        run: |
          install -d -m 700 "$MORIARTY_REPORT_DIR"
          python3 tools/validate_phase9_gate.py --target-commit "$MORIARTY_TARGET_COMMIT" --report-dir "$MORIARTY_REPORT_DIR"
      - name: Preserve Phase 9 MORIARTY report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-moriarty-report-${{ github.run_id }}
          path: ${{ runner.temp }}/moriarty-report/*.json
          if-no-files-found: warn
          retention-days: 14
