name: apply-phase9-remediation

on:
  pull_request:

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply deterministic remediation transform
        run: |
          python3 tools/apply_phase9_remediation.py
          python3 -m py_compile tools/run_moriarty.py tools/validate_phase9_gate.py tools/moriarty_isolation.py
          git diff --check
          rm -rf tools/__pycache__
          git checkout -- .github/workflows/ci.yml .github/workflows/apply-phase9-remediation.yml
      - name: Commit remediation source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Phase 9 exact-commit assurance boundary"
          git push origin "HEAD:${{ github.head_ref }}"
