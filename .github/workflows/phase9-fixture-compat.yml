name: phase9-fixture-compat

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: phase9-fixture-compat
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply fixture compatibility patch
        run: |
          set -euo pipefail
          python3 .github/phase9_fixture_compat.py
          python3 -m py_compile tools/moriarty_isolation.py
          git diff --check
          test "$(git diff --name-only)" = "tools/moriarty_isolation.py"
          git config user.name "Trent Slade"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tools/moriarty_isolation.py
          git commit -m "Keep Phase 9 checksum fixtures non-executable"
          git push origin HEAD:agent/phase9-moriarty-graduation
