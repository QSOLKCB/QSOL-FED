name: phase10-lake-manifest-fix

on:
  push:
    branches:
      - formal/phase10-lean-v0.11

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Patch and validate
        run: |
          set -euo pipefail
          python3 tools/phase10_lake_manifest_fix.py
          python3 tools/validate_phase10_gate.py
          git diff --check
      - name: Commit finished candidate
        run: |
          set -euo pipefail
          git config user.name "Trent Slade"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git rm tools/phase10_lake_manifest_fix.py .github/workflows/phase10-lake-manifest-fix.yml
          git add tools/validate_phase10_gate.py
          git diff --cached --check
          git commit -m "Check resolved Lake dependency graph only"
          echo "RETAINED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:formal/phase10-lean-v0.11
