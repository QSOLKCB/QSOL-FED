name: apply-phase9-codex-round12-fixed

on:
  push:
    branches: [agent/phase9-moriarty-graduation]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-moriarty-graduation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply corrected round 12 hardening
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_phase9_codex_round12.py')
          text = path.read_text(encoding='utf-8')
          old = '''# The replacement above includes the HARD_FALSE_CLAIMS opener, remove duplicated opener if present.
          replace_once(
              "tools/validate_phase9_gate.py",
              "HARD_FALSE_CLAIMS = {\\nHARD_FALSE_CLAIMS = {\\n",
              "HARD_FALSE_CLAIMS = {\\n",
          )
          
          '''
          if text.count(old) != 1:
              raise SystemExit('round12 driver correction marker drift')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          python3 tools/apply_phase9_codex_round12.py
          git diff --check
          rm -rf tools/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/moriarty_isolation.py tools/run_moriarty.py tools/validate_phase9_gate.py schemas/moriarty-counterexample-v1.schema.json MORIARTY.md
          git commit -m "Harden Phase 9 isolation and replay contracts"
          git push origin HEAD:agent/phase9-moriarty-graduation
