name: phase9-review4-finalize

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: phase9-review4-finalize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fix cleanup negative test and remove applicator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/validate_phase9_gate.py')
          source = path.read_text(encoding='utf-8')
          old = '    moriarty._cleanup_probe_writable_paths(cleanup_root)\n'
          new = '    moriarty._force_remove_probe_path(cleanup_root)\n'
          if source.count(old) == 1:
              source = source.replace(old, new, 1)
          elif source.count(new) != 1:
              raise SystemExit('cleanup negative-test source state unexpected')
          path.write_text(source, encoding='utf-8')
          PY
          python3 -m py_compile tools/validate_phase9_gate.py
          git diff --check
          git rm .github/workflows/phase9-review4-finalize.yml
          git config user.name "QSOL Phase 9 Repair"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tools/validate_phase9_gate.py
          git commit -m "Fix Phase 9 cleanup negative-test ordering"
          git push origin HEAD:agent/phase9-moriarty-graduation
