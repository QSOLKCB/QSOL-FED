name: apply-lstree-recursion-fix

on:
  push:
    branches: [agent/phase9-moriarty-graduation]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-moriarty-graduation
          fetch-depth: 0
          persist-credentials: true
      - name: Patch recursive exact tree walk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/run_moriarty.py')
          text = path.read_text(encoding='utf-8')
          old = '("ls-tree", "-rz", "--full-tree", commit),'
          new = '("ls-tree", "-r", "-z", "--full-tree", commit),'
          if text.count(old) != 1:
              raise SystemExit(f'expected one ls-tree marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile tools/run_moriarty.py
          rm -rf tools/__pycache__
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/run_moriarty.py
          git commit -m "Walk exact commit tree recursively"
          git push origin HEAD:agent/phase9-moriarty-graduation
