name: phase9-runtime-fix

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: phase9-runtime-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply runtime closure stabilization
        run: |
          set -euo pipefail
          python3 .github/phase9_runtime_fix.py
          python3 -m py_compile tools/run_moriarty.py tools/validate_phase9_gate.py
          git diff --check
          git rm .github/phase9_runtime_fix.py .github/workflows/phase9-runtime-fix.yml
          git config user.name "Trent Slade"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tools/run_moriarty.py tools/validate_phase9_gate.py
          git commit -m "Stabilize Phase 9 Rust runtime closure"
          git push origin HEAD:agent/phase9-moriarty-graduation
