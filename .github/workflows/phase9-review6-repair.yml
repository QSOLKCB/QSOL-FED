name: phase9-review6-repair

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: phase9-review6-repair
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply four Phase 9 review fixes
        run: |
          set -euo pipefail
          python3 .github/phase9_review6_repair.py
          python3 -m py_compile tools/run_moriarty.py tools/validate_phase9_gate.py
          git diff --check
          git rm .github/workflows/phase9-review6-repair.yml .github/phase9_review6_repair.py
          git config user.name "Trent Slade"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tools/run_moriarty.py tools/validate_phase9_gate.py .github/workflows/ci.yml
          git commit -m "Harden Phase 9 replay and Cargo boundaries"
          git push origin HEAD:agent/phase9-moriarty-graduation
