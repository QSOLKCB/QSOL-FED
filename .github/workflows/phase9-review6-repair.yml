          ordered_commits = []
          seen = set()
          for commit in commits:
              if not isinstance(commit, str) or sha_re.fullmatch(commit) is None:
                  raise SystemExit("historical Cargo prefetch commit invalid")
              if commit in seen:
                  continue
              seen.add(commit)
              if git("cat-file", "-t", commit).stdout != b"commit\n":
                  raise SystemExit("historical Cargo prefetch revision is not a commit")
              if git("merge-base", "--is-ancestor", commit, target, check=False).returncode != 0:
                  raise SystemExit("historical Cargo prefetch revision outside target ancestry")
              ordered_commits.append(commit)

          expected = {}
          for index, commit in enumerate(ordered_commits):
