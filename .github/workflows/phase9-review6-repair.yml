          import hashlib
          import json
          import os
          import stat
          import sys
          from pathlib import Path

          cargo_home = Path(sys.argv[1]).resolve(strict=True)
          expected = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          cache_root = cargo_home / "registry" / "cache"
          if not cache_root.is_dir():
