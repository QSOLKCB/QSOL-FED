name: phase9-review6-repair

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: phase9-review6-repair
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply four Phase 9 review fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner_path = Path("tools/run_moriarty.py")
          validator_path = Path("tools/validate_phase9_gate.py")
          workflow_path = Path(".github/workflows/ci.yml")

          runner = runner_path.read_text(encoding="utf-8")
          validator = validator_path.read_text(encoding="utf-8")
          workflow = workflow_path.read_text(encoding="utf-8")

          def require_once(text: str, needle: str, label: str) -> None:
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")

          # 1. Close repository-controlled Cargo execution hooks.
          helper_marker = "def _reject_repository_cargo_execution_hooks("
          if helper_marker not in runner:
              anchor = "def validate_rust_target_topology(source_root: Path) -> None:\n"
              require_once(runner, anchor, "Cargo topology function")
              helper = '''def _cargo_dependency_table_reject_path(table: Any, label: str) -> None:
              if table is None:
                  return
              if not isinstance(table, dict):
                  fail(f"moriarty_cargo_dependency_table_invalid:{label}")
              for dependency_name, specification in table.items():
                  if not isinstance(dependency_name, str) or not dependency_name:
                      fail(f"moriarty_cargo_dependency_name_invalid:{label}")
                  if isinstance(specification, dict) and "path" in specification:
                      fail(f"moriarty_cargo_path_dependency_forbidden:{label}:{dependency_name}")


def _reject_repository_cargo_execution_hooks(manifest: dict[str, Any], source_root: Path) -> None:
    package = manifest.get("package")
    if not isinstance(package, dict):
        fail("moriarty_cargo_package_identity_drift")
    if package.get("build") not in (None, False) or os.path.lexists(source_root / "build.rs"):
        fail("moriarty_cargo_package_build_script_forbidden")
    if "links" in package:
        fail("moriarty_cargo_package_links_forbidden")
    if "patch" in manifest or "replace" in manifest:
        fail("moriarty_cargo_dependency_override_forbidden")

    for table_name in ("dependencies", "dev-dependencies", "build-dependencies"):
        table = manifest.get(table_name)
        _cargo_dependency_table_reject_path(table, table_name)
        if table_name == "build-dependencies" and isinstance(table, dict) and table:
            fail("moriarty_cargo_build_dependencies_forbidden")

    targets = manifest.get("target")
    if targets is None:
        return
    if not isinstance(targets, dict):
        fail("moriarty_cargo_target_dependency_table_invalid")
    for selector, target_tables in targets.items():
        if not isinstance(selector, str) or not isinstance(target_tables, dict):
            fail("moriarty_cargo_target_dependency_table_invalid")
        for table_name in ("dependencies", "dev-dependencies", "build-dependencies"):
            table = target_tables.get(table_name)
            _cargo_dependency_table_reject_path(table, f"target:{selector}:{table_name}")
            if table_name == "build-dependencies" and isinstance(table, dict) and table:
                fail("moriarty_cargo_target_build_dependencies_forbidden")
'''
              runner = runner.replace(anchor, helper + "\n\n" + anchor, 1)

          call_anchor = '''    package = manifest.get("package")
    if not isinstance(package, dict) or package.get("name") != "qsol-fed":
        fail("moriarty_cargo_package_identity_drift")
'''
          if "    _reject_repository_cargo_execution_hooks(manifest, source_root)\n" not in runner:
              require_once(runner, call_anchor, "Cargo topology package check")
              runner = runner.replace(
                  call_anchor,
                  call_anchor + "    _reject_repository_cargo_execution_hooks(manifest, source_root)\n",
                  1,
              )

          # 2. Remove recursive /usr and /usr/local exposure from Landlock read/exec roots.
          old_system_exec = '''def _system_read_exec_paths() -> tuple[Path, ...]:
    return tuple(path for path in (Path("/usr"), Path("/bin"), Path("/lib"), Path("/lib64")) if path.exists())
'''
          new_system_exec = '''def _system_read_exec_paths() -> tuple[Path, ...]:
    # Closed runtime roots only. Never grant recursive /usr or /usr/local access.
    candidates = (Path("/usr/bin"), Path("/usr/lib"), Path("/bin"), Path("/lib"), Path("/lib64"))
    return tuple(path for path in candidates if path.exists())
'''
          if old_system_exec in runner:
              runner = runner.replace(old_system_exec, new_system_exec, 1)
          elif new_system_exec not in runner:
              raise SystemExit("system read/exec closure: unexpected source state")

          # 3. Reclaim exact-export and Cargo-template replay state immediately.
          replay_start = runner.index("def _run_counterexample_replay_probe(\n")
          replay_end = runner.index("\n\ndef verify_accepted_counterexamples(\n", replay_start)
          current_replay = runner[replay_start:replay_end]
          if "_cleanup_replay_workspace_paths" not in current_replay:
              new_replay = '''def _cleanup_replay_workspace_paths(workspace: Path, *paths: Path) -> None:
    root = Path(workspace).absolute()
    for path in paths:
        absolute = Path(path).absolute()
        if absolute == root or not absolute.is_relative_to(root):
            fail("moriarty_replay_cleanup_path_escape")
        _force_remove_probe_path(absolute)


def _run_counterexample_replay_probe(
    item: dict[str, Any],
    index: int,
