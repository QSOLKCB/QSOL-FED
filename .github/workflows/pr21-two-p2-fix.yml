name: PR21 two P2 hardening fix

on:
  push:
    branches:
      - ci/moriarty-writable-scan-race
    paths:
      - .github/workflows/pr21-two-p2-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/moriarty-writable-scan-race
          fetch-depth: 0
      - name: Apply and commit PID identity and scan-budget hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/pr21_two_p2_fix.py
          python3 -m py_compile tools/moriarty_isolation.py tools/run_moriarty.py tools/validate_phase9_gate.py
          python3 - <<'PY'
          import json
          for path in ("state/phase9.json", "claims/phase9.json"):
              with open(path, encoding="utf-8") as handle:
                  json.load(handle)
          PY
          git diff --check
          grep -q 'pidfd_send_signal' tools/moriarty_isolation.py
          grep -q '_timed_writable_check' tools/run_moriarty.py
          grep -q 'probe_cgroup_signals_pidfd_bound' claims/phase9.json
          grep -q 'probe_writable_scan_suspension_not_charged_to_timeout' state/phase9.json
          grep -q 'stale/recycled outside-cgroup PID identity' tools/validate_phase9_gate.py
          git rm tools/pr21_two_p2_fix.py
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tools/moriarty_isolation.py tools/run_moriarty.py tools/validate_phase9_gate.py state/phase9.json claims/phase9.json MORIARTY.md
          git commit -m "fix: bind cgroup signals and account scan suspension"
          git push origin HEAD:ci/moriarty-writable-scan-race
