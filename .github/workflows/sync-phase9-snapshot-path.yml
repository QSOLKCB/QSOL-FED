name: sync-phase9-snapshot-path

on:
  push:
    branches: [agent/phase9-moriarty-graduation]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-moriarty-graduation
          fetch-depth: 0
          persist-credentials: true
      - name: Synchronize validator snapshot path
        run: |
          python3 tools/sync_phase9_snapshot_path.py
          python3 -m py_compile tools/validate_phase9_gate.py
          git diff --check
          rm -rf tools/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate_phase9_gate.py
          git commit -m "Align Phase 9 validator with safe CI snapshot path"
          git push origin HEAD:agent/phase9-moriarty-graduation
