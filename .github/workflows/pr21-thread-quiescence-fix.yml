name: PR21 thread quiescence fix

on:
  push:
    branches:
      - ci/moriarty-writable-scan-race
    paths:
      - .github/workflows/pr21-thread-quiescence-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/moriarty-writable-scan-race
          fetch-depth: 0
      - name: Apply and commit thread-complete quiescence hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/pr21_thread_quiescence_fix.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if count != 1:\n        raise SystemExit(f"{path}: expected exactly one replacement target, found {count}: {old[:120]!r}")\n    target.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          new = '''    if count == 2 and path == "tools/validate_phase9_gate.py" and "probe_writable_scan_cgroup_suspended" in old:\n        target.write_text(text.replace(old, new), encoding="utf-8")\n        return\n    if count != 1:\n        raise SystemExit(f"{path}: expected exactly one replacement target, found {count}: {old[:120]!r}")\n    target.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          if text.count(old) != 1:
              raise SystemExit("thread patch carrier guard block drift")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 tools/pr21_thread_quiescence_fix.py
          python3 -m py_compile tools/moriarty_isolation.py tools/validate_phase9_gate.py
          python3 - <<'PY'
          import json
          for path in ("state/phase9.json", "claims/phase9.json"):
              with open(path, encoding="utf-8") as handle:
                  json.load(handle)
          PY
          git diff --check
          grep -q 'probe_writable_scan_all_threads_verified' state/phase9.json
          grep -q 'probe_writable_scan_all_threads_verified' claims/phase9.json
          grep -q 'cgroup.threads' tools/moriarty_isolation.py
          grep -q 'worker_count = 120' tools/validate_phase9_gate.py
          grep -q 'every cgroup thread is verified stopped' MORIARTY.md
          git rm -f tools/pr21_thread_quiescence_fix.py
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add tools/moriarty_isolation.py tools/validate_phase9_gate.py state/phase9.json claims/phase9.json MORIARTY.md
          git commit -m "fix: verify every probe cgroup thread before scan"
          git push origin HEAD:ci/moriarty-writable-scan-race
