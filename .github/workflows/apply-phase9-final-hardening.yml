name: apply-phase9-final-hardening

on:
  push:
    branches:
      - agent/phase9-moriarty-graduation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-moriarty-graduation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply final hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_phase9_final_hardening.py')
          text = path.read_text(encoding='utf-8')
          start = text.index("    apply_step = '''      - name: Apply final Phase 9 hardening")
          end_marker = '    text = replace_once(text, apply_step, \'\', "remove self patch step")\n'
          end = text.index(end_marker, start) + len(end_marker)
          text = text[:start] + text[end:]
          text = text.replace('    patch_ci()\n', '', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/apply_phase9_final_hardening.py
          python3 -m py_compile tools/moriarty_isolation.py tools/run_moriarty.py tools/validate_phase9_gate.py
          git diff --check
          rm -rf tools/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close final Phase 9 assurance gaps"
          git push origin HEAD:agent/phase9-moriarty-graduation
