name: phase9-hook-audit

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: phase9-hook-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      CARGO_HOME: ${{ runner.temp }}/phase9-hook-audit-cargo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch exact locked archives only
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup run 1.97.1 cargo fetch --locked
      - name: Audit registry build hooks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          import tomllib
          from pathlib import Path

          cargo_home = Path(os.environ["CARGO_HOME"])
          lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          hooks = []
          missing = []
          for package in lock.get("package", []):
              source = package.get("source")
              if not isinstance(source, str) or not source.startswith("registry+"):
                  continue
              name = package["name"]
              version = package["version"]
              checksum = package["checksum"]
              filename = f"{name}-{version}.crate"
              candidates = sorted((cargo_home / "registry" / "cache").glob(f"*/{filename}"))
              matched = None
              for candidate in candidates:
                  digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
                  if digest == checksum:
                      matched = candidate
                      break
              if matched is None:
                  missing.append([name, version, checksum])
                  continue
              prefix = f"{name}-{version}/"
              manifest_bytes = None
              root_build_rs = False
              with tarfile.open(matched, mode="r:*") as archive:
                  for member in archive:
                      if member.name == prefix + "build.rs" and member.isfile():
                          root_build_rs = True
                      if member.name == prefix + "Cargo.toml" and member.isfile():
                          extracted = archive.extractfile(member)
                          if extracted is None:
                              raise SystemExit(f"unreadable manifest: {filename}")
                          manifest_bytes = extracted.read(1_048_577)
                          if len(manifest_bytes) > 1_048_576:
                              raise SystemExit(f"manifest too large: {filename}")
              if manifest_bytes is None:
                  raise SystemExit(f"missing Cargo.toml: {filename}")
              manifest = tomllib.loads(manifest_bytes.decode("utf-8"))
              package_table = manifest.get("package")
              if not isinstance(package_table, dict):
                  raise SystemExit(f"invalid package table: {filename}")
              declared = package_table.get("build")
              if root_build_rs or declared not in (None, False):
                  hooks.append([name, version, checksum])
          print("PHASE9_REGISTRY_BUILD_HOOK_ALLOWLIST=" + json.dumps(sorted(hooks), separators=(",", ":")))
          print("PHASE9_REGISTRY_ARCHIVES_MISSING=" + json.dumps(sorted(missing), separators=(",", ":")))
          PY
