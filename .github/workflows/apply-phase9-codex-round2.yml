name: apply-phase9-codex-round2

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply final Codex hardening
        run: |
          python3 tools/apply_phase9_codex_round2.py
          python3 -m py_compile tools/run_moriarty.py tools/validate_phase9_gate.py tools/moriarty_isolation.py
          git diff --check
          rm -rf tools/__pycache__
      - name: Commit hardened source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/run_moriarty.py tools/validate_phase9_gate.py tools/moriarty_isolation.py MORIARTY.md
          git commit -m "Close final Phase 9 exact-commit boundary gaps"
          git push origin "HEAD:${{ github.head_ref }}"
