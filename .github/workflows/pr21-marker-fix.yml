name: PR21 MORIARTY marker fix

on:
  push:
    branches:
      - ci/moriarty-writable-scan-race
    paths:
      - .github/workflows/pr21-marker-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/moriarty-writable-scan-race
          fetch-depth: 0
      - name: Restore canonical Phase 9 documentation marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("MORIARTY.md")
          text = path.read_text(encoding="utf-8")
          old = "Every cgroup thread is verified stopped before scanning."
          new = "every cgroup thread is verified stopped before scanning."
          if text.count(old) != 1:
              raise SystemExit(f"MORIARTY marker replacement drift: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          grep -q 'every cgroup thread is verified stopped' MORIARTY.md
          git diff --check
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add MORIARTY.md
          git commit -m "fix: restore canonical MORIARTY thread marker"
          git push origin HEAD:ci/moriarty-writable-scan-race
