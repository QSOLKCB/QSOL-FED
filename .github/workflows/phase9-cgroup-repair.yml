name: phase9-cgroup-repair

on:
  push:
    branches:
      - agent/phase9-moriarty-graduation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-moriarty-graduation
          fetch-depth: 0
      - name: Move validator into delegated cgroup service
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          source = path.read_text(encoding='utf-8')

          old_setup = '''          DELEGATE_UNIT="qsol-moriarty-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          sudo systemd-run --quiet --unit="$DELEGATE_UNIT" \\
            --property=Delegate=yes \\
            --property=DelegateSubgroup=anchor \\
            --uid="$(id -u)" --gid="$(id -g)" \\
            /usr/bin/sleep infinity
          echo "MORIARTY_CGROUP_DELEGATE_UNIT=$DELEGATE_UNIT" >> "$GITHUB_ENV"
          CONTROL_GROUP="$(sudo systemctl show "$DELEGATE_UNIT" --property=ControlGroup --value)"
          test -n "$CONTROL_GROUP"
          CGROUP_PARENT="/sys/fs/cgroup${CONTROL_GROUP}"
          test -d "$CGROUP_PARENT"
          test -z "$(cat "$CGROUP_PARENT/cgroup.procs")"
          grep -qw memory "$CGROUP_PARENT/cgroup.controllers"
          grep -qw pids "$CGROUP_PARENT/cgroup.controllers"
          echo '+memory +pids' | sudo tee "$CGROUP_PARENT/cgroup.subtree_control" >/dev/null
          grep -qw memory "$CGROUP_PARENT/cgroup.subtree_control"
          grep -qw pids "$CGROUP_PARENT/cgroup.subtree_control"
          PROBE_CGROUP="$CGROUP_PARENT/probe"
          sudo mkdir "$PROBE_CGROUP"
          echo 2147483648 | sudo tee "$PROBE_CGROUP/memory.max" >/dev/null
          echo 128 | sudo tee "$PROBE_CGROUP/pids.max" >/dev/null
          if test -f "$PROBE_CGROUP/memory.swap.max"; then
            echo 0 | sudo tee "$PROBE_CGROUP/memory.swap.max" >/dev/null
          fi
          if test -f "$PROBE_CGROUP/memory.oom.group"; then
            echo 1 | sudo tee "$PROBE_CGROUP/memory.oom.group" >/dev/null
          fi
          sudo chown "$(id -u):$(id -g)" "$PROBE_CGROUP/cgroup.procs"
          test -w "$PROBE_CGROUP/cgroup.procs"
          test -z "$(cat "$PROBE_CGROUP/cgroup.procs")"
          test "$(cat "$PROBE_CGROUP/memory.max")" = "2147483648"
          test "$(cat "$PROBE_CGROUP/pids.max")" = "128"
          echo "MORIARTY_PROBE_CGROUP=$PROBE_CGROUP" >> "$GITHUB_ENV"
'''
          if source.count(old_setup) != 1:
              raise SystemExit('unexpected old delegated cgroup setup count')
          source = source.replace(old_setup, '', 1)

          old_gate = '''        run: |
          install -d -m 700 "$MORIARTY_REPORT_DIR"
          /usr/bin/python3 -I tools/validate_phase9_gate.py --target-commit "$MORIARTY_TARGET_COMMIT" --report-dir "$MORIARTY_REPORT_DIR"
      - name: Preserve Phase 9 MORIARTY report
'''
          new_gate = '''        run: |
          set -euo pipefail
          install -d -m 700 "$MORIARTY_REPORT_DIR"
          DELEGATE_UNIT="qsol-moriarty-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          sudo systemd-run --quiet --wait --pipe --collect --unit="$DELEGATE_UNIT" \\
            --property=Delegate=yes \\
            --property=DelegateSubgroup=anchor \\
            --uid="$(id -u)" --gid="$(id -g)" \\
            --working-directory="$GITHUB_WORKSPACE" \\
            --setenv=MORIARTY_TARGET_COMMIT="$MORIARTY_TARGET_COMMIT" \\
            --setenv=MORIARTY_REPORT_DIR="$MORIARTY_REPORT_DIR" \\
            --setenv=MORIARTY_RUST_TOOLCHAIN_ROOT="$MORIARTY_RUST_TOOLCHAIN_ROOT" \\
            --setenv=MORIARTY_EXPECTED_PYTHON_VERSION="$MORIARTY_EXPECTED_PYTHON_VERSION" \\
            --setenv=MORIARTY_EXPECTED_RUSTC_VERSION="$MORIARTY_EXPECTED_RUSTC_VERSION" \\
            --setenv=MORIARTY_EXPECTED_CARGO_VERSION="$MORIARTY_EXPECTED_CARGO_VERSION" \\
            --setenv=MORIARTY_CARGO_CACHE_ROOT="$MORIARTY_CARGO_CACHE_ROOT" \\
            --setenv=MORIARTY_PROBE_WRITABLE_ROOT="$MORIARTY_PROBE_WRITABLE_ROOT" \\
            /usr/bin/bash -ceu '
              CURRENT_CGROUP="$(awk -F: '\''$1 == "0" {print $3}'\'' /proc/self/cgroup)"
              case "$CURRENT_CGROUP" in
                */anchor) ;;
                *) echo "delegated validator subgroup missing" >&2; exit 1 ;;
              esac
              CGROUP_PARENT="/sys/fs/cgroup${CURRENT_CGROUP%/anchor}"
              test -d "$CGROUP_PARENT"
              test -z "$(cat "$CGROUP_PARENT/cgroup.procs")"
              grep -qw memory "$CGROUP_PARENT/cgroup.controllers"
              grep -qw pids "$CGROUP_PARENT/cgroup.controllers"
              echo "+memory +pids" > "$CGROUP_PARENT/cgroup.subtree_control"
              grep -qw memory "$CGROUP_PARENT/cgroup.subtree_control"
              grep -qw pids "$CGROUP_PARENT/cgroup.subtree_control"
              PROBE_CGROUP="$CGROUP_PARENT/probe"
              mkdir "$PROBE_CGROUP"
              echo 2147483648 > "$PROBE_CGROUP/memory.max"
              echo 128 > "$PROBE_CGROUP/pids.max"
              if test -f "$PROBE_CGROUP/memory.swap.max"; then echo 0 > "$PROBE_CGROUP/memory.swap.max"; fi
              if test -f "$PROBE_CGROUP/memory.oom.group"; then echo 1 > "$PROBE_CGROUP/memory.oom.group"; fi
              test -w "$PROBE_CGROUP/cgroup.procs"
              test -z "$(cat "$PROBE_CGROUP/cgroup.procs")"
              test "$(cat "$PROBE_CGROUP/memory.max")" = "2147483648"
              test "$(cat "$PROBE_CGROUP/pids.max")" = "128"
              cleanup() {
                set +e
                if test -d "$PROBE_CGROUP"; then
                  while read -r pid; do test -n "$pid" && kill -KILL "$pid" 2>/dev/null || true; done < "$PROBE_CGROUP/cgroup.procs"
                  rmdir "$PROBE_CGROUP" 2>/dev/null || true
                fi
              }
              trap cleanup EXIT
              export MORIARTY_PROBE_CGROUP="$PROBE_CGROUP"
              /usr/bin/python3 -I tools/validate_phase9_gate.py --target-commit "$MORIARTY_TARGET_COMMIT" --report-dir "$MORIARTY_REPORT_DIR"
            '
      - name: Preserve Phase 9 MORIARTY report
'''
          if source.count(old_gate) != 1:
              raise SystemExit('unexpected Phase 9 gate block count')
          source = source.replace(old_gate, new_gate, 1)

          old_release = '''          if test -n "${MORIARTY_PROBE_CGROUP:-}" && test -d "$MORIARTY_PROBE_CGROUP"; then
            while read -r pid; do
              test -n "$pid" && sudo kill -KILL "$pid" 2>/dev/null || true
            done < "$MORIARTY_PROBE_CGROUP/cgroup.procs"
            sudo rmdir "$MORIARTY_PROBE_CGROUP" || true
          fi
          if test -n "${MORIARTY_CGROUP_DELEGATE_UNIT:-}"; then
            sudo systemctl stop "$MORIARTY_CGROUP_DELEGATE_UNIT" 2>/dev/null || true
            sudo systemctl reset-failed "$MORIARTY_CGROUP_DELEGATE_UNIT" 2>/dev/null || true
          fi
'''
          if source.count(old_release) != 1:
              raise SystemExit('unexpected old cgroup release block count')
          source = source.replace(old_release, '', 1)

          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/ci.yml
          git config user.name "QSOL Phase 9 Repair"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Run MORIARTY inside delegated cgroup service"
          git push origin HEAD:agent/phase9-moriarty-graduation
